<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取得擁有者 UID｜concern-board</title>
<style>
  body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;margin:0;padding:24px;background:#f6f7f9;color:#1b2430;max-width:760px}
  h1{font-size:22px;margin:0 0 6px}
  p{line-height:1.6}
  ol{line-height:1.8;padding-left:22px}
  textarea{width:100%;height:190px;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:10px;border:1px solid #9aa5b3;border-radius:6px;box-sizing:border-box}
  button{font:inherit;padding:10px 18px;border-radius:6px;border:0;background:#1b6ac9;color:#fff;cursor:pointer;margin-top:10px}
  button.sec{background:#fff;color:#1b2430;border:1px solid #1b2430}
  .box{background:#fff;border-radius:8px;padding:16px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ok{color:#137333;font-weight:700}.ng{color:#b3261e;font-weight:700}
  #uid{font-family:ui-monospace,Consolas,monospace;font-size:18px;background:#fff7d6;padding:8px 10px;border-radius:6px;display:inline-block;word-break:break-all}
</style>
</head>
<body>
<h1>取得擁有者 UID</h1>
<p>這一頁只做一件事：用你的 Google 帳號登入 Firebase，並顯示你的 UID（使用者 ID）。取得後交給 Claude Code，寫進安全規則；之後這一頁可以刪除。</p>
<ol>
  <li>把 Firebase「新增 Web 應用程式」時複製的整段 <code>firebaseConfig</code> 貼到下方框內（整段 <code>const firebaseConfig = { ... };</code> 照貼即可）。</li>
  <li>按「用 Google 登入」，在跳出的視窗中選擇你的 Google 帳號。</li>
  <li>畫面會顯示你的 UID，按「複製」。</li>
</ol>
<textarea id="cfg" placeholder="const firebaseConfig = {
  apiKey: &quot;...&quot;,
  authDomain: &quot;concern-board-xxxx.firebaseapp.com&quot;,
  databaseURL: &quot;...&quot;,
  projectId: &quot;concern-board-xxxx&quot;,
  ...
};"></textarea>
<button id="go" type="button">用 Google 登入</button>
<div class="box" id="out">尚未登入。</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const out = document.getElementById('out');
function show(html){ out.innerHTML = html; }

function parseConfig(text){
  const pick = k => { const m = text.match(new RegExp(k + '\\s*["\']?\\s*:\\s*["\']([^"\']+)["\']')); return m ? m[1] : undefined; };
  const cfg = { apiKey: pick('apiKey'), authDomain: pick('authDomain'), projectId: pick('projectId'), appId: pick('appId') };
  const missing = ['apiKey','authDomain','projectId'].filter(k => !cfg[k]);
  if (missing.length) throw new Error('找不到：' + missing.join('、') + '。請確認整段 firebaseConfig 都有貼上。');
  return cfg;
}

document.getElementById('go').addEventListener('click', async () => {
  try {
    const cfg = parseConfig(document.getElementById('cfg').value);
    show('登入中…（如果沒有跳出視窗，請允許瀏覽器開啟彈出式視窗）');
    const app = initializeApp(cfg, 'uid-' + Date.now());
    const auth = getAuth(app);
    const res = await signInWithPopup(auth, new GoogleAuthProvider());
    const u = res.user;
    show('<p class="ok">✅ 登入成功</p>' +
         '<p>帳號：' + (u.email || '') + '</p>' +
         '<p>你的 UID：<br><span id="uid"></span></p>' +
         '<button id="copy" type="button" class="sec">複製 UID</button> <span id="copied"></span>' +
         '<p>接下來：把 UID 交給 Claude Code。你也可以到 Firebase → Authentication → 使用者，確認清單中出現了你的帳號，而且「使用者 UID」和這裡一樣。</p>');
    document.getElementById('uid').textContent = u.uid;
    document.getElementById('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(u.uid); document.getElementById('copied').textContent = '已複製'; }
      catch { document.getElementById('copied').textContent = '請手動選取上方文字複製'; }
    });
  } catch (e) {
    const code = e && e.code ? e.code : '';
    const hints = {
      'auth/unauthorized-domain': '這個網域還沒加入「已授權網域」。請到 Firebase → Authentication → 設定 → 已授權網域，新增 ' + location.hostname,
      'auth/operation-not-allowed': 'Google 登入還沒開啟。請到 Firebase → Authentication → 登入方式，開啟「Google」',
      'auth/popup-blocked': '彈出式視窗被擋住了，請允許此網站開啟彈出式視窗後再按一次',
      'auth/popup-closed-by-user': '登入視窗被關閉了，請再按一次',
      'auth/invalid-api-key': 'apiKey 不正確，請重新複製整段 firebaseConfig'
    };
    show('<p class="ng">❌ 登入失敗</p><p>' + (hints[code] || (e.message || e)) + '</p>' + (code ? '<p style="color:#5b6674">錯誤代碼：' + code + '</p>' : ''));
  }
});
</script>
</body>
</html>
